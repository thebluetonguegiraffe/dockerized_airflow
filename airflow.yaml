services:
  postgres:
    image: postgres:16-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - ./airflow/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    container_name: airflow
    build:
      context: .
      # use our own image as it contains all dependencies to run dags
      dockerfile: Dockerfile.airflow
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

    environment:
      # LocalExecutor runs tasks as real OS processes, in parallel, backed by Postgres.
      # SequentialExecutor + SQLite could only run one task at a time and was prone to
      # the scheduler losing its heartbeat under load.
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      # Disable Airflow example DAGs
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'

      # SMTP / Email configuration
      AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
      AIRFLOW__SMTP__SMTP_STARTTLS: 'True'
      AIRFLOW__SMTP__SMTP_SSL: 'False'
      AIRFLOW__SMTP__SMTP_PORT: 587
      AIRFLOW__SMTP__SMTP_MAIL_FROM: thebluetonguegiraffe@gmail.com
      AIRFLOW__SMTP__SMTP_USER: thebluetonguegiraffe@gmail.com

      # Make sure your .env file contains GMAIL_PWD
      AIRFLOW__SMTP__SMTP_PASSWORD: ${GMAIL_PWD}

    volumes:
      # 1. Logs (essential for viewing locally)
      # './logs' means the 'logs' folder next to this YAML file
      - ./airflow/logs:/opt/airflow/logs

      # 2. Global DAGs (for general scripts in .airflow/dags)
      - ./airflow/dags:/opt/airflow/dags

      # 3. Project-specific DAGs (The News Hub)
      - ${HOME}/the_news_hub/airflow_dags:/opt/airflow/dags/the_news_hub
      - ${HOME}/artguide/dags:${HOME}/artguide/dags
      - ${HOME}/netweave/airflow_dags:/opt/airflow/dags/netweave
      - ${HOME}/llm_lens/dags/:/opt/airflow/dags/llm_lens
      - ${HOME}/llm_lens:/opt/airflow/llm_lens 
     
      # 4. Plugins (CRITICAL for 'src' to work!)
      - ./airflow/plugins:/opt/airflow/plugins

      # 5. enables airflow creating other containers
      - /var/run/docker.sock:/var/run/docker.sock

    # Use the same UID as host to avoid permission issues
    user: "${AIRFLOW_UID}:0"
    group_add:
    - "1002" 

    # Restart container unless stopped manually
    restart: unless-stopped
